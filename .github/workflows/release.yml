name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Build source archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$TAG" != v?* ]]; then
            echo "Expected a non-empty tag starting with 'v', got: $TAG" >&2
            exit 1
          fi

          version="${TAG#v}"
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix="logsync-${version}/" \
            --output="dist/logsync-${version}.tgz" \
            "$GITHUB_SHA"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG#v}"
          asset="dist/logsync-${version}.tgz"
          release_args=(--verify-tag --generate-notes)

          if [[ "$version" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "$TAG" "$asset" "${release_args[@]}"
